<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ============================================================
       BUTTERFLY / HOURGLASS ARCHITECTURE DIAGRAM
       
       HOW TO EDIT:
       - Each layer is a <g> block — change rect x/width to make it wider/narrower
       - Change fill="#..." colors to restyle each layer
       - Change the text inside <text> tags to rename labels
       - The funnel <line> elements connect the layers — update x1/x2 to match rect edges
       - viewBox="0 0 680 400" — increase height (400) if you add more layers
       ============================================================ -->

  <!-- ─────────────────────────────────────────
       LAYER 1 — TOP (widest)
       x=140, width=400  →  left edge: 140, right edge: 540
       ───────────────────────────────────────── -->
  <g>
    <rect x="140" y="20" width="400" height="56"
          rx="10"
          fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
    <!-- Title -->
    <text x="340" y="42"
          text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">
      You
    </text>
    <!-- Subtitle -->
    <text x="340" y="62"
          text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" fill="#534AB7">
      chat · voice · CLI
    </text>
  </g>

  <!-- Funnel lines: left edge 140→220, right edge 540→460, center arrow -->
  <line x1="220" y1="76" x2="265" y2="144" stroke="#aaa" stroke-width="0.5"/>
  <line x1="460" y1="76" x2="415" y2="144" stroke="#aaa" stroke-width="0.5"/>
  <line x1="340" y1="76" x2="340" y2="140" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─────────────────────────────────────────
       LAYER 2 — MIDDLE-WIDE
       x=220, width=240  →  left edge: 220, right edge: 460 (narrower than L1)
       ───────────────────────────────────────── -->
  <g>
    <rect x="220" y="144" width="240" height="56"
          rx="10"
          fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="340" y="164"
          text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">
      Orchestration Agent
    </text>
    <text x="340" y="184"
          text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" fill="#0F6E56">
      routes intent · manages session
    </text>
  </g>

  <!-- Funnel lines: left edge 220→260, right edge 460→420, center arrow -->
  <line x1="270" y1="200" x2="295" y2="234" stroke="#aaa" stroke-width="0.5"/>
  <line x1="410" y1="200" x2="385" y2="234" stroke="#aaa" stroke-width="0.5"/>
  <line x1="340" y1="200" x2="340" y2="230" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─────────────────────────────────────────
       LAYER 3 — WAIST (narrowest — the pinch point)
       x=260, width=160  →  left edge: 260, right edge: 420
       ───────────────────────────────────────── -->
  <g>
    <rect x="260" y="234" width="160" height="56"
          rx="10"
          fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="340" y="254"
          text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">
      Fuzzer Agent
    </text>
    <text x="340" y="274"
          text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" fill="#854F0B">
      intent → config → run
    </text>
  </g>

  <!-- Expanding lines: left edge 260→220, right edge 420→460, center arrow -->
  <line x1="295" y1="290" x2="265" y2="324" stroke="#aaa" stroke-width="0.5"/>
  <line x1="385" y1="290" x2="415" y2="324" stroke="#aaa" stroke-width="0.5"/>
  <line x1="340" y1="290" x2="340" y2="320" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─────────────────────────────────────────
       LAYER 4 — BOTTOM (widest again)
       x=140, width=400  →  left edge: 140, right edge: 540
       ───────────────────────────────────────── -->
  <g>
    <rect x="140" y="324" width="400" height="56"
          rx="10"
          fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <text x="340" y="344"
          text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">
      Reporting Agent
    </text>
    <text x="340" y="364"
          text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" fill="#993C1D">
      crash logs → LLM analysis → PDF report
    </text>
  </g>

</svg>
